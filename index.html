<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZuMark Pharma&reg; | Corporate Excellence in Healthcare</title>
<style>
:root {
--brand-red: #BD0000;
--corporate-navy: #1E293B;
--text-dark: #334155;
--bg-light: #F8FAFC;
--white: #FFFFFF;
--accent-gray: #E2E8F0;
}

html {
scroll-behavior: smooth;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
background-color: var(--bg-light);
color: var(--text-dark);
line-height: 1.5;
overflow-x: hidden;
position: relative;
font-size: 14px;
}

.bg-floating-text {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: -1;
overflow: hidden;
pointer-events: none;
opacity: 0.12;
display: flex;
flex-direction: column;
justify-content: space-around;
white-space: nowrap;
}

.bg-text-line {
font-size: clamp(3rem, 8vw, 6rem);
font-weight: 900;
color: var(--brand-red);
text-transform: uppercase;
animation: marquee 25s linear infinite;
}

.bg-text-line.reverse {
animation-direction: reverse;
animation-duration: 30s;
}

@keyframes marquee {
0% { transform: translateX(100%); }
100% { transform: translateX(-100%); }
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(15px); }
to { opacity: 1; transform: translateY(0); }
}

.animate-fade-in {
animation: fadeIn 0.8s ease-out forwards;
}

nav {
background: var(--white);
padding: 0.6rem 1rem;
display: flex;
justify-content: space-between;
align-items: center;
position: sticky;
top: 0;
z-index: 1000;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
}

.logo-container {
display: flex;
flex-direction: column;
align-items: center;
cursor: pointer;
background-color: var(--brand-red);
padding: 10px 15px;
border-radius: 8px;
text-align: center;
z-index: 1002;
}

.logo-main-row {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 4px;
}

.logo-img {
height: 32px;
width: auto;
}

.brand-name {
font-size: 1.2rem;
font-weight: 800;
color: var(--white);
letter-spacing: -0.5px;
line-height: 1;
}

.brand-name sup, .header-tagline sup, .footer-main-title sup {
font-size: 0.65em;
vertical-align: super;
}

.logo-tagline {
color: var(--white);
font-size: 0.75rem;
font-weight: 500;
opacity: 0.9;
letter-spacing: 0.5px;
text-transform: uppercase;
margin-top: 2px;
}

/* Hamburger Menu Styles */
.menu-toggle {
display: none;
flex-direction: column;
justify-content: space-between;
width: 30px;
height: 21px;
background: none;
border: none;
cursor: pointer;
padding: 0;
z-index: 1002;
}

.menu-toggle span {
display: block;
height: 3px;
width: 100%;
background-color: var(--corporate-navy);
border-radius: 3px;
transition: transform 0.3s ease, opacity 0.3s ease;
}

.nav-links {
display: flex;
gap: 12px;
background-color: var(--white);
}

.nav-links a {
text-decoration: none;
color: var(--text-dark);
font-weight: 600;
font-size: 0.85rem;
padding: 4px 8px;
border-radius: 4px;
transition: all 0.2s;
cursor: pointer;
}

.nav-links a:hover, .nav-links a.active {
color: var(--brand-red);
background-color: rgba(189, 0, 0, 0.08);
}

.page-view {
display: none;
animation: fadeIn 0.4s ease-out forwards;
}

.page-view.active {
display: block;
}

header {
background-color: var(--brand-red);
color: var(--white);
padding: 60px 1rem;
text-align: center;
position: relative;
z-index: 1;
}

header h1 {
font-size: clamp(1.8rem, 6vw, 3.2rem);
margin-bottom: 0.8rem;
font-weight: 800;
text-shadow: 0 2px 4px rgba(0,0,0,0.2);
line-height: 1.2;
}

header p {
font-size: clamp(0.9rem, 2vw, 1.1rem);
max-width: 650px;
margin: 0 auto 20px auto;
color: var(--white);
opacity: 0.95;
}

header .header-tagline {
font-size: 1.1rem;
font-weight: 600;
margin-top: 15px;
text-transform: uppercase;
letter-spacing: 1px;
opacity: 0.9;
}

.hero-cta-group {
display: flex;
justify-content: center;
gap: 12px;
flex-wrap: wrap;
margin-top: 25px;
}

.hero-btn {
padding: 10px 20px;
border-radius: 6px;
font-weight: 700;
font-size: 0.9rem;
text-decoration: none;
cursor: pointer;
transition: transform 0.2s;
}

.hero-btn.primary {
background-color: var(--white);
color: var(--brand-red);
}

.hero-btn.secondary {
background-color: rgba(255, 255, 255, 0.15);
color: var(--white);
border: 1px solid var(--white);
}

.products-section {
padding: 50px 1rem;
max-width: 1200px;
margin: 0 auto;
}

.section-title {
text-align: center;
font-size: clamp(1.8rem, 5vw, 2.5rem);
color: var(--corporate-navy);
margin-bottom: 35px;
}

.product-grid {
display: grid;
grid-template-columns: 1fr;
gap: 25px;
}

.product-card {
background: var(--white);
border-radius: 10px;
overflow: hidden;
box-shadow: 0 5px 15px -5px rgba(0, 0, 0, 0.08);
display: flex;
flex-direction: column;
border: 1px solid rgba(0,0,0,0.05);
}

.product-image {
width: 100%;
height: 180px;
object-fit: contain;
background-color: #F1F5F9;
padding: 15px;
}

.product-content {
padding: 20px;
flex-grow: 1;
display: flex;
flex-direction: column;
justify-content: space-between;
}

.product-content h3 {
font-size: 1.35rem;
color: var(--corporate-navy);
margin-bottom: 6px;
}

.tagline {
font-style: italic;
color: var(--brand-red);
margin-bottom: 10px;
font-size: 0.85rem;
font-weight: 600;
}

.salt-section {
background: var(--bg-light);
padding: 10px;
border-radius: 6px;
margin-bottom: 15px;
border-left: 3px solid var(--corporate-navy);
}

.salt-title {
font-weight: 700;
font-size: 0.75rem;
color: var(--corporate-navy);
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 3px;
}

.salt-list {
font-size: 0.85rem;
color: var(--text-dark);
}

.benefits-list {
margin: 8px 0 15px 16px;
font-size: 0.85rem;
color: var(--text-dark);
}

.inquire-btn {
display: inline-block;
width: 100%;
padding: 12px;
background-color: #25D366;
color: var(--white);
text-align: center;
text-decoration: none;
border-radius: 6px;
font-weight: 700;
font-size: 0.95rem;
box-shadow: 0 3px 6px rgba(37, 211, 102, 0.2);
}

/* Coming Soon Section */
.coming-soon-section {
padding: 50px 1rem;
background-color: #FFFFFF;
border-top: 1px solid var(--accent-gray);
border-bottom: 1px solid var(--accent-gray);
}

.coming-soon-banner {
max-width: 1000px;
margin: 0 auto;
background: var(--bg-light);
border: 3px dashed var(--brand-red);
border-radius: 12px;
padding: 40px 20px;
text-align: center;
box-shadow: 0 10px 25px -5px rgba(189, 0, 0, 0.1);
}

.coming-soon-badge {
display: inline-block;
background-color: var(--brand-red);
color: var(--white);
font-weight: 900;
font-size: 1.5rem;
text-transform: uppercase;
letter-spacing: 2px;
padding: 10px 25px;
border-radius: 50px;
margin-bottom: 25px;
box-shadow: 0 4px 15px rgba(189, 0, 0, 0.3);
animation: pulse 2s infinite;
}

@keyframes pulse {
0% { transform: scale(1); }
50% { transform: scale(1.05); }
100% { transform: scale(1); }
}

.coming-soon-title {
font-size: clamp(2rem, 5vw, 3rem);
color: var(--corporate-navy);
margin-bottom: 15px;
font-weight: 800;
}

.coming-soon-desc {
font-size: 1.1rem;
color: var(--text-dark);
max-width: 700px;
margin: 0 auto 30px auto;
line-height: 1.6;
}

.soon-grid {
display: grid;
grid-template-columns: 1fr;
gap: 20px;
max-width: 800px;
margin: 0 auto;
}

.soon-item {
background: var(--white);
padding: 20px;
border-radius: 8px;
border-left: 4px solid var(--brand-red);
box-shadow: 0 2px 8px rgba(0,0,0,0.05);
display: flex;
align-items: center;
gap: 15px;
text-align: left;
}

.soon-icon {
font-size: 2rem;
background: rgba(189, 0, 0, 0.1);
width: 60px;
height: 60px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
flex-shrink: 0;
}

.soon-text h4 {
font-size: 1.2rem;
color: var(--corporate-navy);
margin-bottom: 4px;
}

.soon-text p {
font-size: 0.9rem;
color: var(--text-dark);
}

.about-section {
padding: 50px 1rem;
background-color: var(--bg-light);
min-height: 75vh;
}

.about-content {
max-width: 900px;
margin: 0 auto;
background: var(--white);
padding: 35px 30px;
border-radius: 12px;
box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
border-top: 5px solid var(--corporate-navy);
}

.about-h2 {
font-size: clamp(1.8rem, 4vw, 2.5rem);
color: var(--corporate-navy);
margin-bottom: 25px;
text-align: center;
font-weight: 800;
}

.about-p {
font-size: 1rem;
color: var(--text-dark);
line-height: 1.8;

text-align: left;
}

.contact-card-box {
background: var(--bg-light);
padding: 20px;
border-radius: 10px;
border-left: 4px solid var(--brand-red);
margin: 30px 0;

box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.stats-grid {
display: grid;

gap: 20px;

text-align: center;
}

.stat-card {
padding: 25px;
background: var(--bg-light);
border-radius: 10px;
border-top: 4px solid var(--brand-red);
}

.stat-card:nth-child(2) { border-color: var(--corporate-navy); }
.stat-card:nth-child(3) { border-color: var(--text-dark); }

.promise-box {
background-color: var(--brand-red);
color: var(--white);
padding: 30px;
border-radius: 10px;
text-align: center;
box-shadow: 0 4px 15px rgba(189,0,0,0.2);
}

.founder-section {
padding: 50px 1rem;

}

.founder-container {
max-width: 900px;
margin: 0 auto;
background: var(--white);
padding: 40px 30px;

border-top: 5px solid var(--brand-red);

}

.founder-header-flex {
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
gap: 25px;
margin-bottom: 30px;

}

.founder-photo {
width: 140px;
height: 140px;

object-fit: cover;
border: 4px solid var(--brand-red);
background-color: #E2E8F0;
box-shadow: 0 6px 16px rgba(189, 0, 0, 0.2);
}

.founder-badge {
display: inline-block;
background-color: rgba(189, 0, 0, 0.1);
color: var(--brand-red);
font-weight: 700;
font-size: 0.8rem;
text-transform: uppercase;
letter-spacing: 1px;
padding: 6px 16px;
border-radius: 20px;
margin-bottom: 10px;
}

.founder-title {
font-size: clamp(1.6rem, 4vw, 2.3rem);
color: var(--corporate-navy);
margin-bottom: 8px;
font-weight: 800;
}

.founder-quote {
font-style: italic;
color: var(--brand-red);
font-weight: 600;
font-size: 1.05rem;
background: rgba(189, 0, 0, 0.04);
padding: 16px 20px;
border-left: 4px solid var(--brand-red);
border-radius: 8px;
margin-bottom: 30px;
line-height: 1.6;
}

.founder-text p {
font-size: 1rem;
color: var(--text-dark);
line-height: 1.8;
margin-bottom: 20px;
text-align: left;
}
