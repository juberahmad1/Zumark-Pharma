<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZuMark Pharma | Corporate Excellence in Healthcare</title>
<style>
:root {
--brand-red: #BD0000;
--corporate-navy: #1E293B;
--text-dark: #334155;
--bg-light: #F8FAFC;
--white: #FFFFFF;
--accent-gray: #E2E8F0;
}

html {
scroll-behavior: smooth;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
background-color: var(--bg-light);
color: var(--text-dark);
line-height: 1.5;
overflow-x: hidden;
position: relative;
font-size: 14px;
}

/* Background Floating Text - Only Zumark Pharma in Light Red */
.bg-floating-text {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: -1;
overflow: hidden;
pointer-events: none;
opacity: 0.12;
display: flex;
flex-direction: column;
justify-content: space-around;
white-space: nowrap;
}

.bg-text-line {
font-size: clamp(3rem, 8vw, 6rem);
font-weight: 900;
color: var(--brand-red);
text-transform: uppercase;
animation: marquee 25s linear infinite;
}

.bg-text-line.reverse {
animation-direction: reverse;
animation-duration: 30s;
}

@keyframes marquee {
0% { transform: translateX(100%); }
100% { transform: translateX(-100%); }
}

/* Animations */
@keyframes fadeIn {
from { opacity: 0; transform: translateY(15px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes floating {
0% { transform: translateY(0px) rotate(0deg); }
50% { transform: translateY(-8px) rotate(0.3deg); }
100% { transform: translateY(0px) rotate(0deg); }
}

.animate-fade-in {
animation: fadeIn 0.8s ease-out forwards;
}

.floating-element {
animation: floating 5s ease-in-out infinite;
}

/* Navigation - Compact & Mobile Optimized */
nav {
background: var(--white);
padding: 0.6rem 1rem;
display: flex;
justify-content: space-between;
align-items: center;
position: sticky;
top: 0;
z-index: 1000;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
}

.logo-container {
display: flex;
align-items: center;
gap: 8px;
cursor: pointer;
}

.logo-img {
height: 32px;
width: auto;
}

.brand-name {
font-size: 1.1rem;
font-weight: 700;
color: var(--corporate-navy);
letter-spacing: -0.5px;
}

.nav-links {
display: flex;
gap: 12px;
}

.nav-links a {
text-decoration: none;
color: var(--text-dark);
font-weight: 600;
font-size: 0.85rem;
padding: 4px 8px;
border-radius: 4px;
transition: all 0.2s;
cursor: pointer;
}

.nav-links a:hover, .nav-links a.active {
color: var(--brand-red);
background-color: rgba(189, 0, 0, 0.08);
}

/* Multi-Page View Containers */
.page-view {
display: none;
animation: fadeIn 0.4s ease-out forwards;
}

.page-view.active {
display: block;
}

/* Hero Section */
header {
background-color: var(--brand-red);
color: var(--white);
padding: 60px 1rem;
text-align: center;
position: relative;
}

header h1 {
font-size: clamp(1.8rem, 6vw, 3.2rem);
margin-bottom: 0.8rem;
font-weight: 800;
text-shadow: 0 2px 4px rgba(0,0,0,0.2);
line-height: 1.2;
}

header p {
font-size: clamp(0.9rem, 2vw, 1.1rem);
max-width: 650px;
margin: 0 auto 20px auto;
color: var(--white);
opacity: 0.95;
}

.hero-cta-group {
display: flex;
justify-content: center;
gap: 12px;
flex-wrap: wrap;
}

.hero-btn {
padding: 10px 20px;
border-radius: 6px;
font-weight: 700;
font-size: 0.9rem;
text-decoration: none;
cursor: pointer;
transition: transform 0.2s;
}

.hero-btn.primary {
background-color: var(--white);
color: var(--brand-red);
}

.hero-btn.secondary {
background-color: rgba(255, 255, 255, 0.15);
color: var(--white);
border: 1px solid var(--white);
}

/* Products Section */
.products-section {
padding: 50px 1rem;
max-width: 1200px;
margin: 0 auto;
}

.section-title {
text-align: center;
font-size: clamp(1.8rem, 5vw, 2.5rem);
color: var(--corporate-navy);
margin-bottom: 35px;
}

.product-grid {
display: grid;
grid-template-columns: 1fr;
gap: 25px;
}

.product-card {
background: var(--white);
border-radius: 10px;
overflow: hidden;
box-shadow: 0 5px 15px -5px rgba(0, 0, 0, 0.08);
display: flex;
flex-direction: column;
border: 1px solid rgba(0,0,0,0.05);
}

.product-image {
width: 100%;
height: 180px;
object-fit: contain;
background-color: #F1F5F9;
padding: 15px;
}

.product-content {
padding: 20px;
flex-grow: 1;
display: flex;
flex-direction: column;
justify-content: space-between;
}

.product-content h3 {
font-size: 1.35rem;
color: var(--corporate-navy);
margin-bottom: 6px;
}

.tagline {
font-style: italic;
color: var(--brand-red);
margin-bottom: 10px;
font-size: 0.85rem;
font-weight: 600;
}

.salt-section {
background: var(--bg-light);
padding: 10px;
border-radius: 6px;
margin-bottom: 15px;
border-left: 3px solid var(--corporate-navy);
}

.salt-title {
font-weight: 700;
font-size: 0.75rem;
color: var(--corporate-navy);
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 3px;
}

.salt-list {
font-size: 0.85rem;
color: var(--text-dark);
}

.benefits-list {
margin: 8px 0 15px 16px;
font-size: 0.85rem;
color: var(--text-dark);
}

.inquire-btn {
display: inline-block;
width: 100%;
padding: 12px;
background-color: #25D366;
color: var(--white);
text-align: center;
text-decoration: none;
border-radius: 6px;
font-weight: 700;
font-size: 0.95rem;
box-shadow: 0 3px 6px rgba(37, 211, 102, 0.2);
}

/* Coming Soon Section */
.coming-soon-section {
padding: 50px 1rem;
background-color: #FFFFFF;
border-top: 1px solid var(--accent-gray);
border-bottom: 1px solid var(--accent-gray);
}

.coming-soon-grid {
display: grid;
grid-template-columns: 1fr;
gap: 20px;
max-width: 1200px;
margin: 0 auto;
}

.horizon-card {
background: var(--bg-light);
padding: 25px;
border-radius: 10px;
text-align: center;
border: 2px dashed var(--brand-red);
}

.horizon-card:nth-child(2) { border-color: var(--corporate-navy); }
.horizon-card:nth-child(3) { border-color: var(--text-dark); }

/* About Us Page */
.about-section {
padding: 50px 1rem;
background-color: var(--bg-light);
min-height: 75vh;
}

.about-content {
max-width: 900px;
margin: 0 auto;
background: var(--white);
padding: 30px 24px;
border-radius: 12px;
box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
border-top: 5px solid var(--corporate-navy);
}

.about-h2 {
font-size: clamp(1.6rem, 4vw, 2.3rem);
color: var(--corporate-navy);
margin-bottom: 20px;
text-align: center;
}

.about-p {
font-size: 0.96rem;
color: var(--text-dark);
line-height: 1.75;
margin-bottom: 16px;
text-align: left;
}

.contact-card-box {
background: var(--bg-light);
padding: 18px;
border-radius: 8px;
border-left: 4px solid var(--brand-red);
margin: 22px 0;
font-size: 0.9rem;
line-height: 1.7;
color: var(--corporate-navy);
}

.stats-grid {
display: grid;
grid-template-columns: 1fr;
gap: 15px;
margin: 28px 0;
text-align: center;
}

.stat-card {
padding: 20px;
background: var(--bg-light);
border-radius: 10px;
border-top: 4px solid var(--brand-red);
}

.stat-card:nth-child(2) { border-color: var(--corporate-navy); }
.stat-card:nth-child(3) { border-color: var(--text-dark); }

.promise-box
