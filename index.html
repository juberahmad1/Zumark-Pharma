<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZuMark Pharma | Corporate Excellence in Healthcare</title>
<style>
:root {
--brand-red: #D32F2F;
--brand-red-dark: #B71C1C;
--corporate-navy: #0F172A;
--corporate-navy-light: #1E293B;
--text-dark: #334155;
--bg-light: #F8FAFC;
--white: #FFFFFF;
--accent-gray: #E2E8F0;
--shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
--shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
}

html {
scroll-behavior: smooth;
scroll-padding-top: 70px;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
background-color: var(--bg-light);
color: var(--text-dark);
line-height: 1.6;
overflow-x: hidden;
position: relative;
-webkit-font-smoothing: antialiased;
}

/* Background Floating Text - Sleek & Subtle */
.bg-floating-text {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: -1;
overflow: hidden;
pointer-events: none;
opacity: 0.08;
display: flex;
flex-direction: column;
justify-content: space-around;
white-space: nowrap;
}

.bg-text-line {
font-size: clamp(5rem, 12vw, 10rem);
font-weight: 900;
color: var(--brand-red);
text-transform: uppercase;
letter-spacing: -2px;
animation: marquee 35s linear infinite;
}

.bg-text-line.reverse {
animation-direction: reverse;
animation-duration: 40s;
}

@keyframes marquee {
0% { transform: translateX(5%); }
100% { transform: translateX(-55%); }
}

/* Luxury Animations */
@keyframes fadeInUp {
from { opacity: 0; transform: translateY(30px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes floatSlow {
0% { transform: translateY(0px); }
50% { transform: translateY(-10px); }
100% { transform: translateY(0px); }
}

.reveal-on-load {
animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.floating-element {
animation: floatSlow 6s ease-in-out infinite;
}

/* Navigation - Glassmorphism Effect */
nav {
background: rgba(255, 255, 255, 0.95);
backdrop-filter: blur(10px);
padding: 0.75rem 5%;
display: flex;
justify-content: space-between;
align-items: center;
position: sticky;
top: 0;
z-index: 1000;
border-bottom: 1px solid var(--accent-gray);
transition: padding 0.3s ease;
}

.logo-container {
display: flex;
align-items: center;
gap: 12px;
}

.logo-img {
height: 42px;
width: auto;
transition: transform 0.3s ease;
}

.logo-container:hover .logo-img {
transform: scale(1.05);
}

.brand-name {
font-size: 1.3rem;
font-weight: 800;
color: var(--corporate-navy);
letter-spacing: -0.5px;
}

.nav-links {
display: flex;
gap: 2rem;
}

.nav-links a {
text-decoration: none;
color: var(--text-dark);
font-weight: 600;
font-size: 0.95rem;
position: relative;
padding: 5px 0;
transition: color 0.3s ease;
}

.nav-links a::after {
content: '';
position: absolute;
bottom: 0;
left: 0;
width: 0;
height: 2px;
background-color: var(--brand-red);
transition: width 0.3s cubicবিজ্ঞানের ক্ষেত্রে এটি অত্যন্ত গুরুত্বপূর্ণ।
